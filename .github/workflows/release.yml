name: Release
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full merged SHA approved by just release (never deploys)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: agents-release
  cancel-in-progress: false
jobs:
  release:
    # Private-repo required reviewers are unavailable on this billing plan.
    # Publication is manual ONLY: just release confirms PUBLICAR then dispatches this workflow.
    # The versioned gate + repo variable + environment branch policy remain independent barriers.
    if: vars.AGENTS_RELEASE_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, X64, agents-release]
    environment: agents-release
    timeout-minutes: 60
    permissions:
      contents: write
      checks: read
      statuses: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Verify exact SHA approved by the person
        env:
          APPROVED_SHA: ${{ inputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "$APPROVED_SHA"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Wait for checks of the integrated commit (not only the PR)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci/wait-checks.mjs
      - run: bun install --frozen-lockfile
        env:
          LEFTHOOK: '0'
      - name: Build, sign, verify and publish (NO deploy)
        run: node scripts/release/publish.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENTS_RELEASE_APPROVED_SHA: ${{ inputs.sha }}
          AGENTS_RELEASE_KOMODO_KEY: ${{ secrets.AGENTS_RELEASE_KOMODO_KEY }}
          AGENTS_RELEASE_KOMODO_SECRET: ${{ secrets.AGENTS_RELEASE_KOMODO_SECRET }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: release-record-${{ github.sha }}
          path: .release/
          if-no-files-found: ignore
          retention-days: 30
