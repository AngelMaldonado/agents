name: Release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: agents-release
  cancel-in-progress: false
jobs:
  release:
    # Deliberately dormant until the owner authorizes publication and provisions a trusted runner.
    # PR code NEVER executes here. This runner must not be the checkout serving existing users.
    if: vars.AGENTS_RELEASE_ENABLED == 'true'
    runs-on: [self-hosted, linux, X64, agents-release]
    environment: agents-release
    timeout-minutes: 60
    permissions:
      contents: write
      checks: read
      statuses: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify exact integrated SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Wait for checks of the integrated commit (not only the PR)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci/wait-checks.mjs
      - run: bun install --frozen-lockfile
        env:
          LEFTHOOK: '0'
      - name: Build, sign, verify and publish (NO deploy)
        run: node scripts/release/publish.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENTS_RELEASE_KOMODO_KEY: ${{ secrets.AGENTS_RELEASE_KOMODO_KEY }}
          AGENTS_RELEASE_KOMODO_SECRET: ${{ secrets.AGENTS_RELEASE_KOMODO_SECRET }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-record-${{ github.sha }}
          path: .release/
          if-no-files-found: ignore
          retention-days: 30
