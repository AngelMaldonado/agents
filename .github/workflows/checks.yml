name: Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # By hand, from Actions (or `gh workflow run checks.yml --ref main`): a SHA whose checks never started.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# Self-hosted runners on reko-3 (Runner Fleet, label `agents`), by choice, in a public repository: a fork's pull
# request never reaches them (the jobs' `if`, and GitHub asks for approval of every outside contributor's
# workflows). What the runner needs: release/README.md.
jobs:
  quality:
    name: Quality
    # Never a fork's pull request on the self-hosted runner: pushes, by hand, or this repository's own branches.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, agents]
    timeout-minutes: 15
    env:
      AGENTS_DATABASE_URL: postgres://agents:ci-only-password@127.0.0.1:5432/agents_test
      AGENTS_TEST_DATABASE_URL: postgres://agents:ci-only-password@127.0.0.1:5432/agents_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install just
        run: |
          mkdir -p "$RUNNER_TEMP/just"
          curl -fsSL --retry 3 "https://github.com/casey/just/releases/download/1.54.0/just-1.54.0-x86_64-unknown-linux-musl.tar.gz" -o "$RUNNER_TEMP/just.tar.gz"
          echo '193e2b04bac8ff3568ff81cf62f8c9db08f8083e16665e28d400dd35bac47ffd  '"$RUNNER_TEMP/just.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/just.tar.gz" -C "$RUNNER_TEMP/just" just
          echo "$RUNNER_TEMP/just" >> "$GITHUB_PATH"
      - name: Ephemeral PostgreSQL at 127.0.0.1:5432
        run: bash scripts/ci/postgres.sh start
      - run: bun install --frozen-lockfile
        env:
          LEFTHOOK: '0'
      - name: Conventional Commits and PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/ci/pr-title.mjs
      - run: just ci
      - name: Remove the PostgreSQL
        if: always()
        run: bash scripts/ci/postgres.sh stop
  sandbox:
    name: Sandbox E2E
    # Never a fork's pull request on the self-hosted runner: pushes, by hand, or this repository's own branches.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, agents]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install buildx (BuildKit) where the runner lacks it
        run: |
          if docker buildx version >/dev/null 2>&1; then docker buildx version; exit 0; fi
          mkdir -p "$HOME/.docker/cli-plugins"
          curl -fsSL --retry 3 "https://github.com/docker/buildx/releases/download/v0.38.1/buildx-v0.38.1.linux-amd64" -o "$HOME/.docker/cli-plugins/docker-buildx"
          echo 'e25d5cd675092bb5d1d03632fdc46cdf3fede7b514dc5f023a105e00d3ce5ad4  '"$HOME/.docker/cli-plugins/docker-buildx" | sha256sum -c -
          chmod +x "$HOME/.docker/cli-plugins/docker-buildx"
          docker buildx version
      - name: Real sandbox and application candidates, ephemeral PostgreSQL, fake GPT
        run: bash scripts/ci/e2e.sh
        env:
          DOCKER_CONTEXT: default
  required:
    name: Required checks
    if: always()
    needs: [quality, sandbox]
    # It only compares two results. On the self-hosted runner too: GitHub's own do not start while the account
    # is locked by billing («The job was not started because your account is locked due to a billing issue»).
    runs-on: [self-hosted, linux, x64, agents]
    steps:
      - name: Fail closed if any required job failed or was skipped
        env:
          QUALITY: ${{ needs.quality.result }}
          SANDBOX: ${{ needs.sandbox.result }}
        run: test "$QUALITY" = success && test "$SANDBOX" = success
