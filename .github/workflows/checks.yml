name: Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [wip, main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: agents
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: agents_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agents -d agents_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      AGENTS_DATABASE_URL: postgres://agents:ci-only-password@127.0.0.1:5432/agents_test
      AGENTS_TEST_DATABASE_URL: postgres://agents:ci-only-password@127.0.0.1:5432/agents_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Install just
        run: |
          mkdir -p "$RUNNER_TEMP/just"
          curl -fsSL --retry 3 "https://github.com/casey/just/releases/download/1.54.0/just-1.54.0-x86_64-unknown-linux-musl.tar.gz" -o "$RUNNER_TEMP/just.tar.gz"
          echo '193e2b04bac8ff3568ff81cf62f8c9db08f8083e16665e28d400dd35bac47ffd  '"$RUNNER_TEMP/just.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/just.tar.gz" -C "$RUNNER_TEMP/just" just
          echo "$RUNNER_TEMP/just" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
        env:
          LEFTHOOK: '0'
      - name: Conventional PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bun scripts/ci/pr-title.mjs
      - run: just ci
  sandbox:
    name: Sandbox E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Real sandbox and application candidates, ephemeral PostgreSQL, fake GPT
        run: bash scripts/ci/e2e.sh
        env:
          DOCKER_CONTEXT: default
  required:
    name: Required checks
    if: always()
    needs: [quality, sandbox]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed if any required job failed or was skipped
        env:
          QUALITY: ${{ needs.quality.result }}
          SANDBOX: ${{ needs.sandbox.result }}
        run: test "$QUALITY" = success && test "$SANDBOX" = success
