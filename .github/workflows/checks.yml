name: Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: agents
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: agents_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agents -d agents_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      AGENTS_DATABASE_URL: postgres://agents:ci-only-password@127.0.0.1:5432/agents_test
      AGENTS_TEST_DATABASE_URL: postgres://agents:ci-only-password@127.0.0.1:5432/agents_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install just
        run: |
          mkdir -p "$RUNNER_TEMP/just"
          curl -fsSL --retry 3 "https://github.com/casey/just/releases/download/1.54.0/just-1.54.0-x86_64-unknown-linux-musl.tar.gz" -o "$RUNNER_TEMP/just.tar.gz"
          echo '193e2b04bac8ff3568ff81cf62f8c9db08f8083e16665e28d400dd35bac47ffd  '"$RUNNER_TEMP/just.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/just.tar.gz" -C "$RUNNER_TEMP/just" just
          echo "$RUNNER_TEMP/just" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
        env:
          LEFTHOOK: '0'
      - name: Conventional Commits and PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/ci/pr-title.mjs
      - run: just ci
  sandbox:
    name: Sandbox E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Real sandbox and application candidates, ephemeral PostgreSQL, fake GPT
        run: bash scripts/ci/e2e.sh
        env:
          DOCKER_CONTEXT: default
  setup:
    name: Release setup rehearsal
    if: github.event_name == 'pull_request' && github.event.pull_request.head.sha == vars.AGENTS_RELEASE_SETUP_SHA
    runs-on: [self-hosted, linux, X64, '${{ vars.AGENTS_RELEASE_SETUP_RUNNER }}']
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
      - name: Private temporary Git source
        run: |
          node scripts/release/source.mjs > "$RUNNER_TEMP/source.log" 2>&1 &
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:9418/agents.git/HEAD >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -n 40 "$RUNNER_TEMP/source.log"
          exit 1
      - name: Real isolated build/sign/verify, never publish baseline or deploy
        run: node scripts/release/setup-probe.mjs
        env:
          AGENTS_RELEASE_SETUP_SHA: ${{ vars.AGENTS_RELEASE_SETUP_SHA }}
          AGENTS_RELEASE_GIT_PROVIDER: ${{ vars.AGENTS_RELEASE_SETUP_SOURCE }}
          AGENTS_RELEASE_KOMODO_KEY: ${{ secrets.AGENTS_RELEASE_SETUP_KOMODO_KEY }}
          AGENTS_RELEASE_KOMODO_SECRET: ${{ secrets.AGENTS_RELEASE_SETUP_KOMODO_SECRET }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: agents-release-setup-proof
          include-hidden-files: true
          path: |
            .release/public-key.json
            .release/setup-proof.json
          if-no-files-found: error
  required:
    name: Required checks
    if: always()
    needs: [quality, sandbox]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed if any required job failed or was skipped
        env:
          QUALITY: ${{ needs.quality.result }}
          SANDBOX: ${{ needs.sandbox.result }}
        run: test "$QUALITY" = success && test "$SANDBOX" = success
