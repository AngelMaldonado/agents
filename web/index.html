<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Agents · Cuby</title>
		<!-- Cuby agents' robot (components/cuby-bot.tsx); the ICO and PNGs are rasters of the same SVG. -->
		<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=cuby-bot" />
		<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=cuby-bot" />
		<link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/favicon.ico?v=cuby-bot" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=cuby-bot" />
		<script>
			// Same preference and first-paint behavior as Nova; storage may be blocked.
			(() => {
				let theme = null;
				try {
					theme = localStorage.getItem('cuby-theme');
				} catch {}
				if (theme !== 'light' && theme !== 'dark')
					theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				document.documentElement.classList.toggle('dark', theme === 'dark');
				document.documentElement.dataset.theme = theme;
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
