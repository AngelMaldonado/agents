# Agents' dev environment, on reko-3 (just dev up). The code is rsynced to ~/dev/work/agents on
# reko-3 and bind-mounted; bun --watch and Vite pick up changes. https://agents-dev.cubytest.space
#
# Networks:
#   proxy              Traefik (shared, external)
#   agents-dev-internal backend <-> CLIProxyAPI (and web -> backend); no sandbox here
#   agents-dev-sandbox  task containers -> backend only (they never see CLIProxyAPI or Postgres)
#
# Postgres here is dev-only and throwaway: fixed password, internal network, no backups.
name: agents-dev

services:
  server:
    image: oven/bun:1.4
    working_dir: /app
    # .env.dev holds the secrets; it exists only on reko-3, so it is read here, not by compose.
    command: ["sh", "-c", "set -a && . /app/.env.dev && set +a && bun install && cd server && exec bun --watch src/index.ts"]
    environment:
      AGENTS_INSTANCE: dev
      AGENTS_DATA: /data
      AGENTS_CLIPROXY_CONFIG: /cliproxy/config.yaml
      # `just dev fake on` points this at the scripted fake LLM (no tokens spent).
      AGENTS_CLIPROXY_URL: ${AGENTS_CLIPROXY_URL:-http://cliproxy:8317}
      AGENTS_SANDBOX_NETWORK: agents-dev-sandbox
      AGENTS_SANDBOX_SERVER_URL: http://agents-dev-server:8787
      AGENTS_SANDBOX_IMAGE: agents-sandbox:dev
      AGENTS_WEB_DIST: /nonexistent
      AGENTS_DATABASE_URL: postgres://agents:agents@postgres:5432/agents
      AGENTS_TEST_DATABASE_URL: postgres://agents:agents@postgres:5432/agents_test
      # Links in webhooks and the inbound URL shown to the owner (LAN/tailnet only).
      AGENTS_PUBLIC_URL: https://agents-dev.cubytest.space
      # The WhatsApp bridge; AGENTS_WHATSAPP_SECRET comes from .env.dev.
      AGENTS_WHATSAPP_URL: http://whatsapp:8790
      PORT: "8787"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/app
      - data:/data
      - cliproxy:/cliproxy
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      agents-dev-internal:
      agents-dev-sandbox:
        aliases: [agents-dev-server]
      # Prometheus scrapes /metrics (port 9464) here; no Traefik labels, so it is not published.
      proxy:
    restart: unless-stopped

  web:
    image: oven/bun:1.4
    working_dir: /app/web
    command: ["sh", "-c", "until [ -d /app/node_modules ]; do sleep 1; done; exec bun --bun vite --host 0.0.0.0 --port 5173"]
    environment:
      AGENTS_API: http://server:8787
    volumes:
      - ./:/app
    networks: [proxy, agents-dev-internal]
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.agents-dev.entrypoints: websecure
      traefik.http.routers.agents-dev.rule: Host(`agents-dev.cubytest.space`)
      traefik.http.routers.agents-dev.service: agents-dev
      traefik.http.services.agents-dev.loadbalancer.server.port: "5173"
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: agents
      POSTGRES_PASSWORD: agents
      POSTGRES_DB: agents
    volumes:
      # Since the 18 image, PGDATA is /var/lib/postgresql/18/docker: mount the parent.
      - pgdata:/var/lib/postgresql
      - ./scripts/dev-postgres-init.sql:/docker-entrypoint-initdb.d/dev-postgres-init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "agents", "-d", "agents"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [agents-dev-internal]
    restart: unless-stopped

  # WhatsApp (whatsmeow): the number an admin links for this instance. Built by `just whatsapp build`.
  # Its session lives in the `whatsmeow` schema of the dev Postgres. It reads its secret from .env.dev,
  # which only root can read on reko-3, hence user 0 here (in prod it comes from the stack's Environment).
  whatsapp:
    image: agents-whatsapp:dev
    user: "0:0"
    entrypoint: ["sh", "-c", "set -a && . /run/agents.env && set +a && exec /usr/local/bin/whatsapp"]
    environment:
      AGENTS_URL: http://server:8787
      WHATSAPP_DATABASE_URL: postgres://agents:agents@postgres:5432/agents?sslmode=disable&search_path=whatsmeow
    volumes:
      - ./.env.dev:/run/agents.env:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [agents-dev-internal]
    restart: unless-stopped

  cliproxy:
    image: eceasy/cli-proxy-api:v8.0.40
    entrypoint: ["sh", "-c", "until [ -f /cfg/config.yaml ]; do sleep 1; done; exec ./CLIProxyAPI -config /cfg/config.yaml"]
    volumes:
      - cliproxy:/cfg
    networks: [agents-dev-internal]
    restart: unless-stopped

  fake-llm:
    profiles: [fake]
    image: oven/bun:1.4
    command: ["bun", "/app/scripts/fake-llm.ts"]
    volumes:
      - ./scripts:/app/scripts:ro
    networks: [agents-dev-internal]

volumes:
  data:
  cliproxy:
  pgdata:

networks:
  proxy:
    external: true
  agents-dev-internal:
    name: agents-dev-internal
  agents-dev-sandbox:
    name: agents-dev-sandbox
    # Fixed bridge name: reko-3's egress lock matches on it (~/dev/work/reko-3, docker_egress_lock_interfaces).
    driver_opts:
      com.docker.network.bridge.name: agents-dev-sbx
